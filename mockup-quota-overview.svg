  <rect x="734" y="366" width="166" height="130" rx="6" fill="#0B0E13" stroke="#2A3340" stroke-width="2"/>
  <text x="746" y="386" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="16" letter-spacing="3" fill="#8B949E">SCOPE</text>
  <line x1="817" y1="400" x2="817" y2="482" stroke="#2A3340" stroke-width="2"/>
  <line x1="776" y1="441" x2="858" y2="441" stroke="#2A3340" stroke-width="2"/>
  <circle cx="817" cy="441" r="34" fill="none" stroke="#2A3340" stroke-width="3"/>
  <circle cx="817" cy="407" r="4" fill="#3FB950"/>
  <circle cx="851" cy="441" r="4" fill="#3FB950"/>
  <circle cx="817" cy="475" r="4" fill="#3FB950"/>
  <circle cx="783" cy="441" r="4" fill="#D29922"/>
  <circle cx="817" cy="441" r="5" fill="#F0F6FC"/>

  <!-- readout strip -->
  <line x1="36" y1="572" x2="924" y2="572" stroke="#2A3340" stroke-width="2"/>
  <g font-family="ui-monospace,Menlo,Consolas,monospace">
    <text x="60" y="596" font-size="18" letter-spacing="3" fill="#8B949E">TOKENS TODAY</text>
    <text x="60" y="638" font-size="42" fill="#F0F6FC">14.9k</text>
    <text x="300" y="596" font-size="18" letter-spacing="3" fill="#8B949E">COST</text>
    <text x="300" y="638" font-size="42" fill="#F0F6FC">$0.00</text>
    <text x="520" y="596" font-size="18" letter-spacing="3" fill="#8B949E">NEXT RESET</text>
    <text x="520" y="638" font-size="42" fill="#F0F6FC">4H 31M</text>
    <text x="740" y="596" font-size="18" letter-spacing="3" fill="#8B949E">STATUS</text>
    <text x="740" y="638" font-size="42" fill="#3FB950">OK</text>
  </g>
  <rect x="740" y="646" width="160" height="8" rx="4" fill="url(#meter)"/>
  <rect x="872" y="642" width="5" height="16" fill="#F0F6FC"/>
