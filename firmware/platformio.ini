; NM-CYD Quota Monitor firmware (ESP32-2432S028R)
; TFT configured purely via build_flags (USER_SETUP_LOADED) so no manual
; User_Setup.h editing is needed. Two display revisions supported.

[platformio]
default_envs = cyd-st7789

[env:cyd-st7789]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
build_flags =
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MOSI=13
  -D TFT_MISO=12
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=1
  -D SPI_FREQUENCY=40000000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D LOAD_FONT7=1
  -D LOAD_FONT8=1
  -D CYD_ST7789=1
  -D TFT_INVERSION_ON=1
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bblanchon/ArduinoJson@^7.0.4
  tzapu/WiFiManager@^2.0.17
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

[env:cyd-ili9341]
extends = env:cyd-st7789
; Proven on this unit (2026-11-19): alt ILI9341 init fixes column offset,
; inversion ON restores black bg + blue palette. Stock ILI9341_DRIVER shows
; rotated + noise on this panel; ST7789 builds show inverted colors.
build_flags =
  -D USER_SETUP_LOADED=1
  -D ILI9341_2_DRIVER=1
  -D TFT_INVERSION_ON=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MOSI=13
  -D TFT_MISO=12
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=1
  -D SPI_FREQUENCY=40000000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D LOAD_FONT7=1
  -D LOAD_FONT8=1
  -D CYD_ILI9341_DRIVER=1
